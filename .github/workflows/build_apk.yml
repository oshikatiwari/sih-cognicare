name: Build Android APKs

on: [push, workflow_dispatch]

jobs:
  build-flutter-frontend:
    name: Build Smriti Flutter App APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
      - name: Generate Android Platform & Build APK
        working-directory: frontend
        run: |
          flutter create . --platforms=android
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle || true
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: smriti-flutter-app-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
