name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build-flutter-frontend:
    name: Build Smriti Flutter App APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
      - name: Generate Fresh Android Files & Build APK
        run: |
          rm -rf frontend/android
          flutter create temp_app --org com.example
          cp -r temp_app/android frontend/
          rm -rf temp_app
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' frontend/android/app/build.gradle || true
          sed -i 's/minSdkVersion 16/minSdkVersion 21/g' frontend/android/app/build.gradle || true
          cd frontend
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: smriti-flutter-app-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
